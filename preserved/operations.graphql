query commerceCategoryTree($siteId: CommerceSiteId!, $locale: String) { commerceCategoryTree(siteId: $siteId, locale: $locale) { __typename ...Sale ...Category ...Product ...Brand } } fragment Sale on CommerceCategoryTreeElementSale { id name position level thumbnail image parent path hasChildren color } fragment Category on CommerceCategoryTreeElementCategory { id name position level thumbnail image parent path hasChildren color } fragment Product on CommerceCategoryTreeElementProduct { id name position thumbnail image parent path hasChildren productId color } fragment Brand on CommerceCategoryTreeElementBrand { id name position thumbnail image parent path hasChildren color }
query commerceProductDetail($siteId: CommerceSiteId!, $locale: String, $productId: String!, $productImageScale: CommerceAssetScaleOptions) { commerceProductDetail(siteId: $siteId, productId: $productId, locale: $locale) { __typename id price priceStriked isPurchasable stockLevel brand series ean currency categoryPrimary quantityMinOrder preorder { available date } ... on CommerceProductDetail { name categoryPrimaryName pdfPackagingSecurity pdfPackagingUseAndCare teaser { headline bulletpoints } description { text details } currentVariation { id value } variations { id name values { name orderable value image { link } } } variants { id orderable price values { id value } } specs { __typename ... on CommerceProductDetailSpecString { key stringValue unit } ... on CommerceProductDetailSpecFloat { key floatValue unit } ... on CommerceProductDetailSpecBoolean { key booleanValue } } labelsLocalized { id value } brandLogo images { link(scale: $productImageScale) } content { articles { id title description heroImage { link } relatedArticles { id title hero { link } } } } } } }
