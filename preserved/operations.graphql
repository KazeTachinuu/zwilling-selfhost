query commerceProductSearchFilters($siteId: CommerceSiteId!, $locale: String, $search: String, $categoryId: String, $start: Int, $amount: Int, $facets: [CommerceProductSearchFacetInput!], $sortId: String) { commerceProductSearch(siteId: $siteId, categoryId: $categoryId, facets: $facets, amount: $amount, start: $start, locale: $locale, search: $search, sortId: $sortId) { total sorts { id name } facets { id name entries { id name amount } } } }
query commerceProductsPreviews($siteId: CommerceSiteId!, $locale: String, $productIds: [String!]!, $productImageScale: CommerceAssetScaleOptions) { products: commerceProductsDetail(locale: $locale, productIds: $productIds, siteId: $siteId) { __typename ...ProductPreviewFragment } } fragment ProductPreviewFragment on CommerceProductBase { __typename id price priceStriked isPurchasable brand series ean currency stockLevel ... on CommerceProductDetail { name labelsLocalized { id value } images { link(scale: $productImageScale) } } }
query commercePromoBanners($siteId: CommerceSiteId!, $locale: String, $siteLocale: String, $applicationOS: ApplicationOS) { commerceSiteInfo(siteId: $siteId, locale: $locale, siteLocale: $siteLocale, applicationOS: $applicationOS) { promoBanners { text type link } } }
query commerceRecommendation($siteId: CommerceSiteId!, $locale: String, $productIds: [String!], $categoryIds: [String!], $productImageScale: CommerceAssetScaleOptions, $recommender: CommerceRecommender!) { commerceRecommendation(siteId: $siteId, locale: $locale, productIds: $productIds, categoryIds: $categoryIds, recommender: $recommender) { recommendedId products { __typename id categoryPrimary price priceStriked isPurchasable brand series ean currency stockLevel ... on CommerceProductDetail { name labelsLocalized { id value } images { link(scale: $productImageScale) } } } } }
