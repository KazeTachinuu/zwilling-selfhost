query QuillonsFoodGroupList($bucket: FoodGroupBucket!, $locale: String!) { entities: foodgroupList(bucket: $bucket, locale: $locale) { identifier: cloudId hash bucket name section iconName icon iconActive iconAnimated iconPreview position storable { days location icon } } }
query RecipesCount($locale: String!, $recipeIds: [String!], $regions: [String!]) { recipesCount: contentRecipeList(locale: $locale, recipeIds: $recipeIds, regions: $regions, skip: 0, limit: 0) { total } }
query recipesRecommended($locale: String!, $region: String!, $consider: [RecipesRecommendedOptions!], $size: Int, $cursor: String, $seed: Int) { recipesRecommended(locale: $locale, region: $region, consider: $consider, size: $size, cursor: $cursor, seed: $seed) { found start cursor isRandom hits { id language categories title description regions preparationTime cookingTime restingTime overallTime servings ingredients devices tags score } facets { name entries { name amount } } } }
query RecipesSearchList($locale: String!, $query: String!, $facets: [RecipesSearchFacetInput], $parser: RecipesSearchParser) { recipesSearch(locale: $locale, query: $query, facets: $facets, parser: $parser) { found start cursor hits { __typename ...RecipeSearchSuggestionFragment } facets { name entries { name amount } } } } fragment RecipeSearchSuggestionFragment on RecipesSearchResultsHit { id language categories title description regions preparationTime cookingTime restingTime overallTime servings ingredients devices tags score }
query RecipesSearchSuggestions($locale: String!, $query: String!, $facets: [RecipesSearchFacetInput], $parser: RecipesSearchParser) { recipesSearch(locale: $locale, query: $query, facets: $facets, parser: $parser) { recipes: hits { id title } } }
query RegisteredDevicesList($language: String!) { devices(language: $language) { devices { __typename ...DeviceInfoFragment } } } fragment DeviceFragment on deviceBase { articleNumberLocal articleNumberGlobal ean upc brand name color size series image category } fragment DeviceExtensionFragment on deviceExtension { manual faq image typeList productInfo { contentId } } fragment DeviceInfoFragment on deviceInformation { cloudId owner name serialNumber buyDate hasReceipt registerDate device { __typename ...DeviceFragment } extension { __typename ...DeviceExtensionFragment } }
query scheduledNotifications { scheduledNotifications { servertime usertime usertimezone notifications { cloudid linked ymd time content { key value } } } }
query searchPopularTerms($locale: String!, $siteId: CommerceSiteId!) { commerceProductPopularSearchTerms(locale: $locale, siteId: $siteId) }
query searchSuggestions($count: Int, $locale: String, $siteId: CommerceSiteId!, $searchPhrase: String!) { commerceProductSearchSuggestions(count: $count, locale: $locale, siteId: $siteId, searchPhrase: $searchPhrase) }
query settings($siteId: CommerceSiteId) { general: settings(siteId: $siteId) { __typename ...SettingFragment } goals: settings(siteId: $siteId, type: GOALS) { __typename ...SettingFragment } allergies: settings(siteId: $siteId, type: ALLERGIES) { __typename ...SettingFragment } diatery: settings(siteId: $siteId, type: DIATERY) { __typename ...SettingFragment } } fragment SettingFragment on SettingList { settings { key value } }
