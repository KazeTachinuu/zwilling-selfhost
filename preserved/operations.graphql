query cannot be empty
query commerceBasket($siteId: CommerceSiteId!, $locale: String, $productImageScale: CommerceAssetScaleOptions) { basket: commerceBasket(siteId: $siteId, locale: $locale) { __typename ...BasketOrderFragment } } fragment BasketOrderFragment on CommerceBasket { order { subtotal tax total shippingtotal shippingtax totalSavings currency bonuses: bonusLineItems { isUsed promotionMessage linkedProductId products { id } } items { id bonuseLineItemId brand ean stockLevel price priceStriked quantityMinOrder quantity name bonus stockLevel image { link(scale: $productImageScale) } detail { series isPurchasable preorder { available date } } } } }
query commerceBasketBonuses($siteId: CommerceSiteId!, $locale: String, $productImageScale: CommerceAssetScaleOptions) { basket: commerceBasket(siteId: $siteId, locale: $locale) { order { bonuses: bonusLineItems { bonusId linkedProductId maxQuantity products { __typename ...ProductPreviewFragment } } } } } fragment ProductPreviewFragment on CommerceProductBase { __typename id price priceStriked isPurchasable brand series ean currency stockLevel ... on CommerceProductDetail { name labelsLocalized { id value } images { link(scale: $productImageScale) } } }
query commerceBasketProductsIds($siteId: CommerceSiteId!, $locale: String) { basket: commerceBasket(siteId: $siteId, locale: $locale) { __typename ...BasketSnapshotFragment } } fragment BasketSnapshotFragment on CommerceBasket { order { items { id } bonuses: bonusLineItems { isUsed linkedProductId promotionMessage products { id } } } }
